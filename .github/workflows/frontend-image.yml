name: Frontend container

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-image.yml'
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-container-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/yawaflua/gominecraftbridge

jobs:
  test-build-publish:
    name: Test, build and publish frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Test frontend
        working-directory: frontend
        run: |
          bun run check
          bun run lint
          bun test
          bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master' || github.ref_type == 'tag' || github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=frontend-master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=frontend-latest,enable=${{ github.ref_type == 'tag' || github.event_name == 'release' }}
            type=ref,event=tag,prefix=frontend-,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=frontend-${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' || github.ref_type == 'tag' || github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: true
          sbom: true
