name: Go SDK release checks

on:
  push:
    tags:
      - 'sdk/v*.*.*'

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-sdk:
    name: Build and test Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v6

      - name: Validate SDK tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#sdk/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must have the form sdk/vX.Y.Z, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go.mod
          cache-dependency-path: |
            sdk/go.sum
            examples/hello-native/go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(find sdk examples/hello-native -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Verify SDK module
        working-directory: sdk
        run: |
          go mod verify
          go vet ./...
          go test -race ./...
          go build ./...

      - name: Build native plugin fixture
        run: ./examples/hello-native/build.sh

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Verify Java-to-Go ABI and shaded Paper runtime
        env:
          GMB_TEST_LIBRARY: ${{ github.workspace }}/examples/hello-native/dist/libhello_native.so
        run: gradle :paper:test --rerun-tasks --console=plain
