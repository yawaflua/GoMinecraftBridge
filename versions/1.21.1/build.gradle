plugins {
	id 'dev.architectury.loom'
	id 'maven-publish'
	id 'com.modrinth.minotaur'
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
	archivesName = "${rootProject.archives_base_name}-1.21.1"
}

repositories {
	mavenCentral()
	maven { url 'https://maven.shedaniel.me/' }
	maven { url 'https://maven.terraformersmc.com/releases/' }
	maven { url 'https://api.modrinth.com/maven/' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		gbm {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			vmArg '--enable-native-access=ALL-UNNAMED'
			vmArg '-Djoml.nounsafe=true'
		}
	}
}

def sharedRoot = file('../..')
def prepareMainSources = tasks.register('prepareMainSources', Sync) {
	from(sharedRoot.toPath().resolve('src/main/java')) {
		exclude 'dev/yawaflua/gominecraftbridge/compat/MinecraftVersionAdapter.java'
	}
	from(sharedRoot.toPath().resolve('src/main/generated'))
	from(file('src/main/java'))
	into(layout.buildDirectory.dir('version-sources/main'))
}

sourceSets {
	main {
		java.setSrcDirs([layout.buildDirectory.dir('version-sources/main')])
		resources.setSrcDirs([file('src/main/resources')])
	}
	client {
		java.setSrcDirs([sharedRoot.toPath().resolve('src/client/java'), file('src/client/java')])
	}
	test {
		java.setSrcDirs([sharedRoot.toPath().resolve('src/test/java'), file('src/test/java')])
	}
}

dependencies {
	minecraft 'com.mojang:minecraft:1.21.1'
	mappings loom.officialMojangMappings()
	modImplementation 'net.fabricmc:fabric-loader:0.16.14'
	modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.14+1.21.1'

	implementation 'com.google.code.gson:gson:2.13.2'
	implementation include('com.google.flatbuffers:flatbuffers-java:25.2.10')
	implementation 'net.java.dev.jna:jna:5.18.1'

	modClientImplementation 'me.shedaniel.cloth:cloth-config-fabric:15.0.140'
	modClientImplementation 'maven.modrinth:modmenu:11.0.3'

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

tasks.named('compileJava') {
	dependsOn prepareMainSources
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	jvmArgs '-Djoml.nounsafe=true'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

modrinth {
	projectId = rootProject.providers.gradleProperty('modrinth_project_id')
			.orElse(rootProject.providers.environmentVariable('MODRINTH_PROJECT_ID'))
			.getOrElse('')
	versionNumber = "${project.version}-fabric-1.21.1"
	versionName = "GBM ${project.version} for Fabric/Quilt 1.21.1-1.21.11"
	versionType = rootProject.providers.gradleProperty('modrinth_version_type')
			.orElse(rootProject.providers.environmentVariable('MODRINTH_VERSION_TYPE'))
			.getOrElse('beta')
	changelog = rootProject.providers.gradleProperty('modrinth_changelog')
			.orElse(rootProject.providers.environmentVariable('MODRINTH_CHANGELOG'))
			.getOrElse("GBM ${project.version}")
	uploadFile = tasks.named('remapJar')
	gameVersions = ['1.21.1', '1.21.11']
	loaders = ['fabric', 'quilt']
	detectLoaders = false
	dependencies {
		required.project 'fabric-api'
	}
}

tasks.named('sourcesJar') {
	dependsOn prepareMainSources
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
